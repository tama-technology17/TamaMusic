<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#070709"
  >

  <meta
    name="description"
    content="Tama Project Hub"
  >

  <title>Tama Project Hub</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #070709;

      --card:
        rgba(255,255,255,.055);

      --card-hover:
        rgba(255,255,255,.085);

      --border:
        rgba(255,255,255,.09);

      --border-hover:
        rgba(255,255,255,.2);

      --text: #fff;

      --muted: #8b8b94;

      --muted-2: #5e5e66;

      --success: #48e88b;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:

        radial-gradient(
          circle at 50% -10%,
          rgba(120,90,255,.18),
          transparent 35%
        ),

        radial-gradient(
          circle at 0% 50%,
          rgba(0,160,255,.05),
          transparent 30%
        ),

        var(--bg);

      overflow-x: hidden;

    }

    /* GRID BACKGROUND */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background-image:

        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 25%,
          black 75%,
          transparent
        );

      z-index: -1;

    }

    /* CONTAINER */

    .container {

      width:
        min(1100px,100%);

      margin: auto;

      padding:
        35px 18px 50px;

    }

    /* HEADER */

    header {

      text-align: center;

      margin-bottom: 35px;

      animation:
        fadeUp .7s ease both;

    }

    .logo {

      width: 60px;
      height: 60px;

      margin:
        0 auto 20px;

      display: grid;

      place-items: center;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #fff,
          #bcbcbc
        );

      color: #050505;

      font-size: 24px;

      font-weight: 800;

      box-shadow:
        0 15px 50px
        rgba(255,255,255,.1);

    }

    h1 {

      font-size:
        clamp(34px,8vw,58px);

      line-height: 1;

      letter-spacing:
        -2.5px;

    }

    .subtitle {

      max-width: 550px;

      margin:
        14px auto 0;

      color:
        var(--muted);

      font-size: 14px;

      line-height: 1.7;

    }

    /* STATUS */

    .status {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-top: 18px;

      padding:
        8px 13px;

      border:
        1px solid var(--border);

      border-radius: 50px;

      background:
        rgba(255,255,255,.035);

      color:
        #8f8f98;

      font-size: 11px;

    }

    .status-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--success);

      box-shadow:
        0 0 12px
        var(--success);

    }

    /* TOOLS */

    .tools {

      display: flex;

      align-items: center;

      gap: 10px;

      max-width: 700px;

      margin:
        0 auto 30px;

    }

    .search-wrapper {

      position: relative;

      flex: 1;

    }

    .search-icon {

      position: absolute;

      left: 17px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #666;

      font-size: 18px;

      pointer-events: none;

    }

    #search {

      width: 100%;

      height: 52px;

      padding:
        0 18px 0 46px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      outline: none;

      background:
        rgba(255,255,255,.045);

      color: white;

      font-size: 14px;

      transition: .25s;

    }

    #search::placeholder {
      color: #5f5f67;
    }

    #search:focus {

      border-color:
        rgba(255,255,255,.22);

      background:
        rgba(255,255,255,.065);

    }

    /* REFRESH */

    .refresh {

      width: 52px;
      height: 52px;

      flex-shrink: 0;

      display: grid;

      place-items: center;

      border:
        1px solid var(--border);

      border-radius: 16px;

      background:
        rgba(255,255,255,.045);

      color: #aaa;

      font-size: 18px;

      cursor: pointer;

      transition: .25s;

    }

    .refresh:hover {

      color: white;

      border-color:
        var(--border-hover);

      background:
        rgba(255,255,255,.075);

      transform:
        rotate(15deg);

    }

    /* SECTION */

    .section-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 15px;

    }

    .section-title {

      font-size: 15px;

      font-weight: 600;

    }

    .project-count {

      color:
        var(--muted-2);

      font-size: 12px;

    }

    /* GRID */

    .projects {

      display: grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap: 13px;

    }

    /* CARD */

    .project {

      position: relative;

      display: flex;

      align-items: center;

      gap: 14px;

      min-height: 90px;

      padding: 15px;

      color: white;

      text-decoration: none;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.025)
        );

      overflow: hidden;

      transition:
        transform .25s,
        border-color .25s,
        background .25s,
        box-shadow .25s;

      animation:
        fadeUp .45s ease both;

    }

    .project:hover {

      transform:
        translateY(-4px);

      border-color:
        var(--border-hover);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.09),
          rgba(255,255,255,.04)
        );

      box-shadow:
        0 18px 45px
        rgba(0,0,0,.35);

    }

    .project:active {

      transform:
        scale(.98);

    }

    /* NUMBER */

    .number {

      width: 45px;
      height: 45px;

      flex-shrink: 0;

      display: grid;

      place-items: center;

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius: 14px;

      background:
        rgba(255,255,255,.07);

      color: #999;

      font-size: 11px;

      font-weight: 600;

    }

    /* INFO */

    .info {

      min-width: 0;

      flex: 1;

    }

    .name {

      overflow: hidden;

      color: white;

      font-size: 14px;

      font-weight: 600;

      white-space: nowrap;

      text-overflow: ellipsis;

    }

    .description {

      margin-top: 5px;

      overflow: hidden;

      color: #707078;

      font-size: 11px;

      white-space: nowrap;

      text-overflow: ellipsis;

    }

    .path {

      margin-top: 5px;

      overflow: hidden;

      color: #4f4f56;

      font-family: monospace;

      font-size: 9px;

      white-space: nowrap;

      text-overflow: ellipsis;

    }

    /* ARROW */

    .arrow {

      color: #606068;

      font-size: 20px;

      transition: .25s;

    }

    .project:hover .arrow {

      color: white;

      transform:
        translateX(4px);

    }

    /* LOADING */

    .loading {

      grid-column:
        1 / -1;

      padding: 60px 20px;

      text-align: center;

      color: #666;

      font-size: 13px;

    }

    .loader {

      width: 28px;
      height: 28px;

      margin:
        0 auto 15px;

      border:
        2px solid
        rgba(255,255,255,.1);

      border-top-color: white;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

    }

    /* EMPTY */

    .empty {

      grid-column:
        1 / -1;

      padding: 60px 20px;

      text-align: center;

      color: #666;

      font-size: 13px;

    }

    .empty-icon {

      margin-bottom: 12px;

      font-size: 30px;

      opacity: .5;

    }

    /* ERROR */

    .error {

      grid-column:
        1 / -1;

      padding: 35px 20px;

      text-align: center;

      border:
        1px solid
        rgba(255,80,80,.12);

      border-radius: 18px;

      background:
        rgba(255,50,50,.025);

      color: #a87878;

      font-size: 13px;

    }

    .error strong {

      display: block;

      margin-bottom: 7px;

      color: #d09090;

    }

    .retry {

      margin-top: 15px;

      padding:
        9px 15px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background:
        rgba(255,255,255,.04);

      color: #aaa;

      cursor: pointer;

    }

    /* FOOTER */

    footer {

      margin-top: 50px;

      text-align: center;

      color: #414148;

      font-size: 11px;

    }

    footer span {
      color: #5b5b63;
    }

    /* ANIMATION */

    @keyframes fadeUp {

      from {

        opacity: 0;

        transform:
          translateY(14px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }

    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }

    /* RESPONSIVE */

    @media (min-width: 900px) {

      .projects {

        grid-template-columns:
          repeat(3,minmax(0,1fr));

      }

    }

    @media (max-width: 600px) {

      .container {

        padding:
          28px 14px 40px;

      }

      .projects {

        grid-template-columns: 1fr;

      }

      h1 {

        letter-spacing:
          -1.5px;

      }

    }

  </style>

</head>


<body>


  <main class="container">


    <!-- HEADER -->

    <header>

      <div class="logo">
        T
      </div>

      <h1>
        Project Hub
      </h1>

      <p class="subtitle">
        Semua project web dalam satu tempat.
        Daftar project dikelola melalui projects.json.
      </p>

      <div class="status">

        <span class="status-dot"></span>

        Project Database Online

      </div>

    </header>


    <!-- SEARCH -->

    <div class="tools">

      <div class="search-wrapper">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="search"
          type="search"
          placeholder="Cari project..."
          autocomplete="off"
        >

      </div>


      <button
        id="refresh"
        class="refresh"
        title="Refresh"
      >
        ↻
      </button>

    </div>


    <!-- SECTION -->

    <div class="section-header">

      <div class="section-title">
        Projects
      </div>

      <div
        id="count"
        class="project-count"
      >
        Loading...
      </div>

    </div>


    <!-- PROJECTS -->

    <section
      id="projects"
      class="projects"
    >

      <div class="loading">

        <div class="loader"></div>

        Memuat projects.json...

      </div>

    </section>


    <!-- FOOTER -->

    <footer>

      Tama Technology
      <span>·</span>
      Project Hub

    </footer>


  </main>


  <script>

    /* =========================================
       CONFIG
    ========================================= */

    const PROJECT_FILE =
      "./projects.json";


    /* =========================================
       ELEMENTS
    ========================================= */

    const projectContainer =
      document.getElementById(
        "projects"
      );

    const searchInput =
      document.getElementById(
        "search"
      );

    const countElement =
      document.getElementById(
        "count"
      );

    const refreshButton =
      document.getElementById(
        "refresh"
      );


    /* =========================================
       STATE
    ========================================= */

    let projects = [];


    /* =========================================
       LOAD JSON
    ========================================= */

    async function loadProjects() {

      setLoading(true);


      try {

        /*
          Cache busting.

          Browser tetap mengambil
          projects.json terbaru.
        */

        const url =
          `${PROJECT_FILE}?t=${Date.now()}`;


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            `projects.json tidak ditemukan (${response.status})`
          );

        }


        const data =
          await response.json();


        if (
          !data ||
          !Array.isArray(
            data.projects
          )
        ) {

          throw new Error(
            "Format projects.json tidak valid."
          );

        }


        projects =
          data.projects;


        renderProjects(
          projects
        );


      } catch (error) {

        console.error(error);

        showError(
          error.message
        );


      } finally {

        setLoading(false);

      }

    }


    /* =========================================
       RENDER PROJECTS
    ========================================= */

    function renderProjects(
      list
    ) {

      if (!list.length) {

        countElement.textContent =
          "0 projects";


        projectContainer.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              📂
            </div>

            Belum ada project.

          </div>

        `;

        return;

      }


      countElement.textContent =
        `${list.length} project` +
        (
          list.length !== 1
            ? "s"
            : ""
        );


      projectContainer.innerHTML =

        list
          .map(
            (project,index) =>
              createProjectCard(
                project,
                index
              )
          )
          .join("");

    }


    /* =========================================
       PROJECT CARD
    ========================================= */

    function createProjectCard(
      project,
      index
    ) {

      const number =
        String(index + 1)
          .padStart(2,"0");


      const title =
        project.title ||
        formatName(
          project.name
        );


      const description =
        project.description ||
        "Web Project";


      const url =
        project.url ||
        `/${project.name}/`;


      return `

        <a
          class="project"
          href="${escapeHTML(url)}"
          style="
            animation-delay:
            ${index * 35}ms
          "
        >

          <div class="number">

            ${number}

          </div>


          <div class="info">

            <div class="name">

              ${escapeHTML(title)}

            </div>


            <div class="description">

              ${escapeHTML(
                description
              )}

            </div>


            <div class="path">

              /${escapeHTML(
                project.name
              )}/

            </div>

          </div>


          <div class="arrow">

            →

          </div>

        </a>

      `;

    }


    /* =========================================
       SEARCH
    ========================================= */

    searchInput.addEventListener(
      "input",
      function() {

        const keyword =
          this.value
            .trim()
            .toLowerCase();


        if (!keyword) {

          renderProjects(
            projects
          );

          return;

        }


        const filtered =
          projects.filter(
            project => {

              const name =
                (
                  project.name || ""
                )
                  .toLowerCase();


              const title =
                (
                  project.title || ""
                )
                  .toLowerCase();


              const description =
                (
                  project.description || ""
                )
                  .toLowerCase();


              return (

                name.includes(
                  keyword
                )

                ||

                title.includes(
                  keyword
                )

                ||

                description.includes(
                  keyword
                )

              );

            }
          );


        renderProjects(
          filtered
        );

      }
    );


    /* =========================================
       REFRESH
    ========================================= */

    refreshButton.addEventListener(
      "click",
      loadProjects
    );


    /* =========================================
       LOADING
    ========================================= */

    function setLoading(
      loading
    ) {

      if (!loading) {

        refreshButton.classList.remove(
          "loading"
        );

        return;

      }


      refreshButton.classList.add(
        "loading"
      );


      projectContainer.innerHTML = `

        <div class="loading">

          <div class="loader"></div>

          Memuat projects.json...

        </div>

      `;

    }


    /* =========================================
       ERROR
    ========================================= */

    function showError(
      message
    ) {

      countElement.textContent =
        "Error";


      projectContainer.innerHTML = `

        <div class="error">

          <strong>
            Gagal memuat project
          </strong>

          ${escapeHTML(message)}

          <br>

          <button
            class="retry"
            onclick="loadProjects()"
          >
            Coba Lagi
          </button>

        </div>

      `;

    }


    /* =========================================
       FORMAT NAME
    ========================================= */

    function formatName(
      name
    ) {

      return String(name)

        .replace(
          /[-_]+/g,
          " "
        )

        .replace(
          /([a-z])([A-Z])/g,
          "$1 $2"
        )

        .replace(
          /\s+/g,
          " "
        )

        .trim()

        .replace(
          /\b\w/g,
          char =>
            char.toUpperCase()
        );

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(
      value
    ) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================================
       START
    ========================================= */

    loadProjects();

  </script>


</body>

</html>
