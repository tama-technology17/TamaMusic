<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tama Project Hub</title>

  <meta
    name="theme-color"
    content="#08080a"
  >

  <meta
    name="description"
    content="Tama Project Hub - Collection of web projects"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #070709;
      --card: rgba(255,255,255,.055);
      --card-hover: rgba(255,255,255,.085);
      --border: rgba(255,255,255,.09);
      --border-hover: rgba(255,255,255,.2);

      --text: #ffffff;
      --muted: #8b8b94;
      --muted-2: #5e5e66;

      --success: #48e88b;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(120, 90, 255, .18),
          transparent 35%
        ),
        radial-gradient(
          circle at 0% 50%,
          rgba(0, 160, 255, .05),
          transparent 30%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND
    ========================= */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 25%,
          black 75%,
          transparent
        );

      z-index: -1;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: min(1100px, 100%);

      margin: auto;

      padding:
        35px 18px 50px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;

      margin-bottom: 35px;

      animation:
        fadeUp .7s ease both;
    }

    .logo {
      width: 60px;
      height: 60px;

      margin:
        0 auto 20px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      color: #050505;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #bcbcbc
        );

      font-size: 24px;
      font-weight: 800;

      box-shadow:
        0 15px 50px rgba(255,255,255,.1);
    }

    h1 {
      font-size:
        clamp(34px, 8vw, 58px);

      line-height: 1;

      letter-spacing: -2.5px;
    }

    .subtitle {
      max-width: 550px;

      margin:
        14px auto 0;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: inline-flex;

      align-items: center;
      gap: 8px;

      margin-top: 18px;

      padding:
        8px 13px;

      border:
        1px solid var(--border);

      border-radius: 50px;

      background:
        rgba(255,255,255,.035);

      color: #8f8f98;

      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 12px var(--success);
    }

    /* =========================
       SEARCH AREA
    ========================= */

    .tools {
      display: flex;

      align-items: center;

      gap: 10px;

      max-width: 700px;

      margin:
        0 auto 30px;

      animation:
        fadeUp .7s .1s ease both;
    }

    .search-wrapper {
      position: relative;

      flex: 1;
    }

    .search-icon {
      position: absolute;

      left: 17px;
      top: 50%;

      transform:
        translateY(-50%);

      color: #666;

      font-size: 18px;

      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 52px;

      padding:
        0 18px 0 46px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      outline: none;

      color: white;

      background:
        rgba(255,255,255,.045);

      font-size: 14px;

      transition: .25s;
    }

    #search::placeholder {
      color: #5f5f67;
    }

    #search:focus {
      border-color:
        rgba(255,255,255,.22);

      background:
        rgba(255,255,255,.065);

      box-shadow:
        0 0 30px rgba(255,255,255,.035);
    }

    /* =========================
       REFRESH
    ========================= */

    .refresh {
      width: 52px;
      height: 52px;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      border:
        1px solid var(--border);

      border-radius: 16px;

      background:
        rgba(255,255,255,.045);

      color: #aaa;

      font-size: 18px;

      cursor: pointer;

      transition: .25s;
    }

    .refresh:hover {
      color: white;

      border-color:
        rgba(255,255,255,.22);

      background:
        rgba(255,255,255,.075);

      transform:
        rotate(15deg);
    }

    .refresh:active {
      transform:
        scale(.94)
        rotate(30deg);
    }

    .refresh.loading {
      animation:
        spin 1s linear infinite;
    }

    /* =========================
       SECTION HEADER
    ========================= */

    .section-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 15px;

      animation:
        fadeUp .7s .15s ease both;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
    }

    .project-count {
      color: var(--muted-2);

      font-size: 12px;
    }

    /* =========================
       PROJECT GRID
    ========================= */

    .projects {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 13px;
    }

    /* =========================
       PROJECT CARD
    ========================= */

    .project {
      position: relative;

      display: flex;

      align-items: center;

      gap: 14px;

      min-height: 90px;

      padding: 15px;

      color: white;

      text-decoration: none;

      border:
        1px solid var(--border);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.025)
        );

      overflow: hidden;

      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;

      animation:
        fadeUp .45s ease both;
    }

    .project::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(255,255,255,.09),
          transparent 38%
        );

      opacity: 0;

      transition: .3s;

      pointer-events: none;
    }

    .project:hover {
      transform:
        translateY(-4px);

      border-color:
        var(--border-hover);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.09),
          rgba(255,255,255,.04)
        );

      box-shadow:
        0 18px 45px rgba(0,0,0,.35);
    }

    .project:hover::before {
      opacity: 1;
    }

    .project:active {
      transform:
        scale(.98);
    }

    /* =========================
       NUMBER
    ========================= */

    .number {
      position: relative;
      z-index: 1;

      width: 45px;
      height: 45px;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      border:
        1px solid rgba(255,255,255,.07);

      border-radius: 14px;

      background:
        rgba(255,255,255,.07);

      color: #999;

      font-size: 11px;
      font-weight: 600;
    }

    /* =========================
       INFO
    ========================= */

    .info {
      position: relative;
      z-index: 1;

      min-width: 0;

      flex: 1;
    }

    .name {
      overflow: hidden;

      color: white;

      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .path {
      margin-top: 6px;

      overflow: hidden;

      color: #62626a;

      font-family: monospace;

      font-size: 10px;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    /* =========================
       ARROW
    ========================= */

    .arrow {
      position: relative;
      z-index: 1;

      color: #606068;

      font-size: 20px;

      transition: .25s;
    }

    .project:hover .arrow {
      color: white;

      transform:
        translateX(4px);
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      grid-column:
        1 / -1;

      padding: 60px 20px;

      text-align: center;

      color: #666;

      font-size: 13px;
    }

    .loader {
      width: 28px;
      height: 28px;

      margin:
        0 auto 15px;

      border:
        2px solid rgba(255,255,255,.1);

      border-top-color:
        white;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      grid-column:
        1 / -1;

      padding: 60px 20px;

      text-align: center;

      color: #666;

      font-size: 13px;
    }

    .empty-icon {
      margin-bottom: 12px;

      font-size: 30px;

      opacity: .5;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      grid-column:
        1 / -1;

      padding: 35px 20px;

      text-align: center;

      border:
        1px solid rgba(255,80,80,.12);

      border-radius: 18px;

      background:
        rgba(255,50,50,.025);

      color: #a87878;

      font-size: 13px;
    }

    .error strong {
      display: block;

      margin-bottom: 7px;

      color: #d09090;
    }

    .retry {
      margin-top: 15px;

      padding:
        9px 15px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background:
        rgba(255,255,255,.04);

      color: #aaa;

      cursor: pointer;
    }

    .retry:hover {
      color: white;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 50px;

      text-align: center;

      color: #414148;

      font-size: 11px;
    }

    footer span {
      color: #5b5b63;
    }

    /* =========================
       ANIMATION
    ========================= */

    @keyframes fadeUp {

      from {
        opacity: 0;

        transform:
          translateY(14px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (min-width: 900px) {

      .projects {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }

    @media (max-width: 600px) {

      .container {
        padding:
          28px 14px 40px;
      }

      .tools {
        gap: 8px;
      }

      .projects {
        grid-template-columns:
          1fr;
      }

      h1 {
        letter-spacing: -1.5px;
      }

      .project {
        min-height: 84px;
      }

    }

  </style>

</head>

<body>

  <main class="container">

    <!-- HEADER -->

    <header>

      <div class="logo">
        T
      </div>

      <h1>
        Project Hub
      </h1>

      <p class="subtitle">
        Semua project web dalam satu tempat.
        Daftar project diperbarui otomatis dari GitHub.
      </p>

      <div class="status">

        <span class="status-dot"></span>

        GitHub Connected

      </div>

    </header>


    <!-- SEARCH + REFRESH -->

    <div class="tools">

      <div class="search-wrapper">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="search"
          type="search"
          placeholder="Cari project..."
          autocomplete="off"
        >

      </div>

      <button
        id="refresh"
        class="refresh"
        type="button"
        title="Refresh project"
      >
        ↻
      </button>

    </div>


    <!-- SECTION -->

    <div class="section-header">

      <div class="section-title">
        Projects
      </div>

      <div
        id="count"
        class="project-count"
      >
        Loading...
      </div>

    </div>


    <!-- PROJECTS -->

    <section
      id="projects"
      class="projects"
    >

      <div class="loading">

        <div class="loader"></div>

        Mengambil project dari GitHub...

      </div>

    </section>


    <!-- FOOTER -->

    <footer>

      Tama Technology
      <span>·</span>
      Project Hub
      <span>·</span>
      GitHub

    </footer>

  </main>


  <script>

    /* =====================================================
       GITHUB CONFIGURATION
       =====================================================

       GANTI 2 BAGIAN INI

       GITHUB_OWNER
       = username GitHub kamu

       GITHUB_REPO
       = nama repository kamu

       Contoh:

       const GITHUB_OWNER = "tama-technology17";
       const GITHUB_REPO = "TamaProjects";

    ===================================================== */


    const GITHUB_OWNER =
      "tama-technology17";

    const GITHUB_REPO =
      "TamaMusic";


    /*
       Branch yang digunakan.

       Biasanya:
       main

       Kalau repository kamu memakai master,
       ubah menjadi:

       "master"
    */

    const GITHUB_BRANCH =
      "main";


    /*
       Folder root tempat project berada.

       Kalau project langsung di root:

       ""

       Kalau project berada di folder:

       "projects"
    */

    const PROJECT_ROOT =
      "";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const projectContainer =
      document.getElementById("projects");

    const searchInput =
      document.getElementById("search");

    const countElement =
      document.getElementById("count");

    const refreshButton =
      document.getElementById("refresh");


    /* =====================================================
       STATE
    ===================================================== */

    let allProjects = [];


    /* =====================================================
       GITHUB API
    ===================================================== */

    function getApiUrl() {

      const path =
        PROJECT_ROOT
          ? `/${PROJECT_ROOT}`
          : "";

      return (
        `https://api.github.com/repos/` +
        `${encodeURIComponent(GITHUB_OWNER)}/` +
        `${encodeURIComponent(GITHUB_REPO)}` +
        `/contents${path}` +
        `?ref=${encodeURIComponent(GITHUB_BRANCH)}`
      );

    }


    /* =====================================================
       LOAD PROJECTS
    ===================================================== */

    async function loadProjects() {

      setLoading(true);

      try {

        validateConfig();

        const response =
          await fetch(
            getApiUrl(),
            {
              headers: {
                "Accept":
                  "application/vnd.github+json"
              },

              cache: "no-store"
            }
          );


        if (!response.ok) {

          if (response.status === 404) {

            throw new Error(
              "Repository atau branch tidak ditemukan."
            );

          }

          if (response.status === 403) {

            throw new Error(
              "GitHub API rate limit tercapai. " +
              "Coba lagi beberapa saat."
            );

          }

          throw new Error(
            `GitHub API error: ${response.status}`
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "Response GitHub tidak valid."
          );

        }


        /*
          GitHub Contents API memberikan:

          file
          directory

          Kita hanya mengambil directory.
        */

        const directories =
          data.filter(
            item =>
              item.type === "dir"
          );


        /*
          Untuk memastikan folder benar-benar
          merupakan project, kita cek apakah
          folder tersebut mempunyai index.html.
        */

        const checkedProjects =
          await Promise.all(

            directories.map(
              async folder => {

                const valid =
                  await hasIndexHtml(
                    folder.path
                  );

                if (!valid) {
                  return null;
                }


                return {

                  name:
                    folder.name,

                  path:
                    folder.path,

                  url:
                    createProjectUrl(
                      folder.path
                    ),

                  githubUrl:
                    folder.html_url

                };

              }
            )

          );


        allProjects =
          checkedProjects
            .filter(Boolean)
            .sort(
              (a, b) =>
                a.name.localeCompare(
                  b.name,
                  undefined,
                  {
                    numeric: true,
                    sensitivity: "base"
                  }
                )
            );


        renderProjects(
          allProjects
        );


      } catch (error) {

        console.error(
          "Project Hub Error:",
          error
        );

        showError(
          error.message
        );

      } finally {

        setLoading(false);

      }

    }


    /* =====================================================
       CHECK INDEX.HTML
    ===================================================== */

    async function hasIndexHtml(
      folderPath
    ) {

      const url =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(GITHUB_OWNER)}/` +
        `${encodeURIComponent(GITHUB_REPO)}` +
        `/contents/` +
        `${folderPath}/index.html` +
        `?ref=${encodeURIComponent(GITHUB_BRANCH)}`;


      try {

        const response =
          await fetch(
            url,
            {
              headers: {
                "Accept":
                  "application/vnd.github+json"
              },

              cache: "no-store"
            }
          );


        return response.ok;

      } catch {

        return false;

      }

    }


    /* =====================================================
       CREATE PROJECT URL
    ===================================================== */

    function createProjectUrl(
      folderPath
    ) {

      /*
        Karena Vercel akan melayani folder
        sebagai static directory:

        /folder-name/
      */

      const encodedPath =
        folderPath
          .split("/")
          .map(
            part =>
              encodeURIComponent(part)
          )
          .join("/");


      return `/${encodedPath}/`;

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderProjects(
      projects
    ) {

      if (!projects.length) {

        countElement.textContent =
          "0 projects";

        projectContainer.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              📂
            </div>

            Belum ada project yang ditemukan.

          </div>

        `;

        return;

      }


      countElement.textContent =
        `${projects.length} project` +
        (
          projects.length !== 1
            ? "s"
            : ""
        );


      projectContainer.innerHTML =
        projects
          .map(
            (project, index) =>
              createCard(
                project,
                index
              )
          )
          .join("");

    }


    /* =====================================================
       CREATE CARD
    ===================================================== */

    function createCard(
      project,
      index
    ) {

      const number =
        String(index + 1)
          .padStart(2, "0");


      const title =
        formatProjectName(
          project.name
        );


      return `

        <a
          class="project"
          href="${escapeHTML(
            project.url
          )}"
          style="animation-delay:${index * 35}ms"
        >

          <div class="number">

            ${number}

          </div>


          <div class="info">

            <div class="name">

              ${escapeHTML(title)}

            </div>


            <div class="path">

              /${escapeHTML(
                project.path
              )}/

            </div>

          </div>


          <div class="arrow">

            →

          </div>

        </a>

      `;

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        const keyword =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!keyword) {

          renderProjects(
            allProjects
          );

          return;

        }


        const filtered =
          allProjects.filter(
            project => {

              const name =
                project.name
                  .toLowerCase();

              const title =
                formatProjectName(
                  project.name
                ).toLowerCase();


              return (
                name.includes(keyword) ||
                title.includes(keyword)
              );

            }
          );


        renderProjects(
          filtered
        );

      }
    );


    /* =====================================================
       REFRESH
    ===================================================== */

    refreshButton.addEventListener(
      "click",
      () => {

        loadProjects();

      }
    );


    /* =====================================================
       LOADING
    ===================================================== */

    function setLoading(
      loading
    ) {

      refreshButton.classList.toggle(
        "loading",
        loading
      );


      if (loading) {

        projectContainer.innerHTML = `

          <div class="loading">

            <div class="loader"></div>

            Mengambil project dari GitHub...

          </div>

        `;

      }

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      countElement.textContent =
        "Error";


      projectContainer.innerHTML = `

        <div class="error">

          <strong>
            Gagal mengambil project
          </strong>

          ${escapeHTML(message)}

          <br>

          <button
            class="retry"
            onclick="loadProjects()"
          >
            Coba Lagi
          </button>

        </div>

      `;

    }


    /* =====================================================
       FORMAT NAME
    ===================================================== */

    function formatProjectName(
      name
    ) {

      return name

        .replace(
          /[-_]+/g,
          " "
        )

        .replace(
          /([a-z])([A-Z])/g,
          "$1 $2"
        )

        .replace(
          /\s+/g,
          " "
        )

        .trim()

        .replace(
          /\b\w/g,
          char =>
            char.toUpperCase()
        );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =====================================================
       VALIDATE CONFIG
    ===================================================== */

    function validateConfig() {

      if (
        GITHUB_OWNER ===
        "USERNAME_GITHUB_KAMU"
      ) {

        throw new Error(
          "Ganti GITHUB_OWNER dengan username GitHub kamu."
        );

      }


      if (
        GITHUB_REPO ===
        "NAMA_REPOSITORY_KAMU"
      ) {

        throw new Error(
          "Ganti GITHUB_REPO dengan nama repository kamu."
        );

      }

    }


    /* =====================================================
       START
    ===================================================== */

    loadProjects();

  </script>

</body>

</html>
