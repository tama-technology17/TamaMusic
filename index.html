<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tama Project Hub</title>

  <meta
    name="theme-color"
    content="#08080a"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08080a;
      --card: rgba(255,255,255,.055);
      --border: rgba(255,255,255,.09);
      --text: #fff;
      --muted: #85858e;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(120,90,255,.18),
          transparent 35%
        ),
        var(--bg);
    }

    .container {
      width: min(1050px, 100%);
      margin: auto;
      padding: 35px 18px 50px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      width: 58px;
      height: 58px;

      margin: auto;
      margin-bottom: 20px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: white;
      color: black;

      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      font-size: clamp(32px, 8vw, 55px);
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 12px;

      color: var(--muted);

      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-top: 18px;
      padding: 8px 13px;

      border: 1px solid var(--border);
      border-radius: 50px;

      background: rgba(255,255,255,.03);

      color: #999;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #43e88a;

      box-shadow:
        0 0 12px #43e88a;
    }

    .search {
      position: relative;

      max-width: 600px;
      margin: auto;
    }

    .search input {
      width: 100%;
      height: 52px;

      padding: 0 18px 0 45px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      outline: none;

      color: white;

      background:
        rgba(255,255,255,.045);

      font-size: 14px;
    }

    .search span {
      position: absolute;

      left: 17px;
      top: 50%;

      transform: translateY(-50%);

      color: #777;

      font-size: 18px;
    }

    .section {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 28px 0 15px;
    }

    .section h2 {
      font-size: 15px;
    }

    #count {
      color: #666;
      font-size: 12px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .project {
      display: flex;
      align-items: center;
      gap: 14px;

      min-height: 88px;

      padding: 15px;

      color: white;
      text-decoration: none;

      border:
        1px solid var(--border);

      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.025)
        );

      transition: .25s;
    }

    .project:hover {
      transform: translateY(-4px);

      border-color:
        rgba(255,255,255,.2);

      background:
        rgba(255,255,255,.08);

      box-shadow:
        0 15px 40px rgba(0,0,0,.35);
    }

    .number {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background:
        rgba(255,255,255,.07);

      color: #aaa;

      font-size: 12px;
      font-weight: 600;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .name {
      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .path {
      margin-top: 6px;

      color: #66666e;

      font-family: monospace;
      font-size: 10px;
    }

    .arrow {
      color: #666;
      font-size: 20px;

      transition: .25s;
    }

    .project:hover .arrow {
      color: white;
      transform: translateX(4px);
    }

    .loading,
    .empty,
    .error {
      padding: 50px 20px;

      text-align: center;

      color: #666;
      font-size: 13px;
    }

    .error {
      color: #b56b6b;
    }

    footer {
      margin-top: 45px;

      text-align: center;

      color: #444;

      font-size: 11px;
    }

    @media (max-width: 650px) {

      .container {
        padding: 28px 14px;
      }

      .projects {
        grid-template-columns: 1fr;
      }

      h1 {
        letter-spacing: -1.5px;
      }

    }

  </style>

</head>

<body>

  <main class="container">

    <header>

      <div class="logo">
        T
      </div>

      <h1>
        Project Hub
      </h1>

      <p class="subtitle">
        Semua project kamu dalam satu tempat.
      </p>

      <div class="status">
        <span class="dot"></span>
        Server Online
      </div>

    </header>


    <div class="search">

      <span>⌕</span>

      <input
        id="search"
        type="search"
        placeholder="Cari project..."
        autocomplete="off"
      >

    </div>


    <div class="section">

      <h2>
        Projects
      </h2>

      <span id="count">
        Loading...
      </span>

    </div>


    <section
      id="projects"
      class="projects"
    >

      <div class="loading">
        Memuat project...
      </div>

    </section>


    <footer>
      Tama Technology · Project Hub
    </footer>

  </main>


  <script>

    const projectContainer =
      document.getElementById("projects");

    const search =
      document.getElementById("search");

    const count =
      document.getElementById("count");


    let projects = [];


    async function loadProjects() {

      try {

        const response =
          await fetch("/api/projects");

        if (!response.ok) {
          throw new Error(
            "API error"
          );
        }

        const data =
          await response.json();

        projects =
          data.projects || [];

        render(projects);

      } catch (error) {

        console.error(error);

        projectContainer.innerHTML = `
          <div class="error">
            Gagal mengambil daftar project.
            <br><br>
            Pastikan server.py sedang berjalan.
          </div>
        `;

        count.textContent =
          "Error";
      }

    }


    function render(list) {

      count.textContent =
        `${list.length} project` +
        (list.length !== 1 ? "s" : "");


      if (!list.length) {

        projectContainer.innerHTML = `
          <div class="empty">
            Belum ada project.
          </div>
        `;

        return;
      }


      projectContainer.innerHTML =
        list.map((project, index) => {

          const number =
            String(index + 1)
              .padStart(2, "0");

          return `

            <a
              class="project"
              href="${project.url}"
            >

              <div class="number">
                ${number}
              </div>

              <div class="info">

                <div class="name">
                  ${escapeHTML(project.title)}
                </div>

                <div class="path">
                  ${escapeHTML(project.path)}
                </div>

              </div>

              <div class="arrow">
                →
              </div>

            </a>

          `;

        }).join("");

    }


    search.addEventListener(
      "input",
      () => {

        const keyword =
          search.value
            .toLowerCase()
            .trim();

        const filtered =
          projects.filter(project =>
            project.name
              .toLowerCase()
              .includes(keyword)
          );

        render(filtered);

      }
    );


    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    loadProjects();

  </script>

</body>

</html>
