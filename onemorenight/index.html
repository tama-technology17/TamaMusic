<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070709">
<title>Rose Music Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #070709;
    --panel: rgba(255,255,255,.045);
    --panel-strong: rgba(255,255,255,.075);
    --border: rgba(255,255,255,.08);
    --text: #fff;
    --muted: rgba(255,255,255,.48);
    --accent: #ff4f87;
    --accent-light: #ff91b0;
    --shadow: 0 30px 80px rgba(0,0,0,.5);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
}

body {
    overflow-x: hidden;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.app {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    padding: 24px;
}

.background {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 25% 15%, rgba(255,79,135,.13), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,145,176,.08), transparent 30%),
        #070709;
    filter: blur(35px);
}

.player {
    position: relative;
    z-index: 1;
    width: min(1250px, 100%);
    min-height: calc(100vh - 48px);
    margin: auto;
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
    gap: 22px;
}

.player-card,
.lyrics-card {
    background: rgba(255,255,255,.035);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 30px;
}

.player-card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 34px;
}

.cover-wrapper {
    position: relative;
    width: min(100%, 310px);
    aspect-ratio: 1;
    margin: 0 auto 30px;
}

.cover-glow {
    position: absolute;
    inset: 12%;
    background: var(--accent);
    opacity: .18;
    filter: blur(55px);
    border-radius: 50%;
    transition: opacity .5s ease, transform .5s ease;
}

.cover {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 25px;
    display: block;
    box-shadow: 0 25px 55px rgba(0,0,0,.55);
    transition:
        transform .6s cubic-bezier(.2,.8,.2,1),
        box-shadow .6s ease;
}

.cover.playing {
    transform: scale(1.025);
    animation: floating 4s ease-in-out infinite;
}

.cover.playing + .cover-glow {
    opacity: .3;
    transform: scale(1.08);
}

@keyframes floating {
    0%, 100% {
        transform: scale(1.025) translateY(0);
    }
    50% {
        transform: scale(1.04) translateY(-5px);
    }
}

.song-info {
    text-align: center;
    margin-bottom: 24px;
}

.song-title {
    margin: 0;
    font-size: clamp(22px, 4vw, 29px);
    font-weight: 800;
    letter-spacing: -.7px;
}

.song-artist {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.song-album {
    margin: 5px 0 0;
    color: rgba(255,255,255,.28);
    font-size: 12px;
}

.progress-area {
    margin-top: 5px;
}

.progress {
    width: 100%;
    height: 5px;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 99px;
    outline: none;
    cursor: pointer;
    background: rgba(255,255,255,.1);
}

.progress::-webkit-slider-runnable-track {
    height: 5px;
    border-radius: 99px;
    background:
        linear-gradient(
            to right,
            var(--accent) 0%,
            var(--accent) var(--progress, 0%),
            rgba(255,255,255,.1) var(--progress, 0%),
            rgba(255,255,255,.1) 100%
        );
}

.progress::-moz-range-track {
    height: 5px;
    border-radius: 99px;
    background: rgba(255,255,255,.1);
}

.progress::-moz-range-progress {
    height: 5px;
    background: var(--accent);
    border-radius: 99px;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    width: 13px;
    height: 13px;
    margin-top: -4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px rgba(255,79,135,.7);
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
}

.progress:hover::-webkit-slider-thumb,
.progress:active::-webkit-slider-thumb {
    opacity: 1;
}

.time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    color: rgba(255,255,255,.38);
    font-size: 11px;
}

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 27px;
}

.control {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: rgba(255,255,255,.7);
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.06);
    transition: transform .2s ease, background .2s ease, color .2s ease;
}

.control:hover {
    transform: translateY(-2px);
    color: #fff;
    background: rgba(255,255,255,.1);
}

.control:active {
    transform: scale(.94);
}

.play-button {
    width: 62px;
    height: 62px;
    color: #fff;
    background: var(--accent);
    box-shadow: 0 10px 30px rgba(255,79,135,.25);
}

.play-button:hover {
    background: var(--accent-light);
}

.icon {
    width: 19px;
    height: 19px;
    fill: currentColor;
}

.play-button .icon {
    width: 23px;
    height: 23px;
}

.volume-row {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-top: 24px;
    color: rgba(255,255,255,.55);
}

.volume {
    flex: 1;
    height: 4px;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 99px;
    background: rgba(255,255,255,.1);
}

.volume::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 99px;
    background:
        linear-gradient(
            to right,
            var(--accent-light) 0%,
            var(--accent-light) var(--volume, 80%),
            rgba(255,255,255,.1) var(--volume, 80%),
            rgba(255,255,255,.1) 100%
        );
}

.volume::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -4px;
    border-radius: 50%;
    background: #fff;
}

.status {
    text-align: center;
    margin-top: 20px;
    color: rgba(255,255,255,.22);
    font-size: 10px;
}

.lyrics-card {
    min-height: 0;
    position: relative;
    overflow: hidden;
}

.lyrics-header {
    position: absolute;
    z-index: 5;
    top: 0;
    left: 0;
    right: 0;
    padding: 25px 30px 18px;
    background: linear-gradient(
        to bottom,
        rgba(7,7,9,.95),
        rgba(7,7,9,.5),
        transparent
    );
    pointer-events: none;
}

.lyrics-label {
    color: rgba(255,255,255,.3);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.lyrics-section {
    position: relative;
    height: 100%;
    min-height: 650px;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    padding: 145px 30px 170px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.12) transparent;
    overscroll-behavior: contain;
}

.lyrics-section::-webkit-scrollbar {
    width: 5px;
}

.lyrics-section::-webkit-scrollbar-track {
    background: transparent;
}

.lyrics-section::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.12);
    border-radius: 20px;
}

/* Fade mask */
.lyrics-card::before,
.lyrics-card::after {
    content: "";
    position: absolute;
    z-index: 4;
    left: 0;
    right: 0;
    height: 125px;
    pointer-events: none;
}

.lyrics-card::before {
    top: 0;
    background: linear-gradient(
        to bottom,
        rgba(7,7,9,1),
        rgba(7,7,9,.72),
        transparent
    );
}

.lyrics-card::after {
    bottom: 0;
    background: linear-gradient(
        to top,
        rgba(7,7,9,1),
        rgba(7,7,9,.72),
        transparent
    );
}

.line {
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    padding: 10px 16px;
    border-radius: 15px;
    color: rgba(255,255,255,.4);
    opacity: .55;
    font-size: clamp(17px, 2vw, 22px);
    font-weight: 600;
    line-height: 1.55;
    letter-spacing: -.35px;
    text-align: center;
    transform: scale(.98);
    transition:
        opacity .45s ease,
        color .45s ease,
        transform .45s cubic-bezier(.2,.8,.2,1),
        background .35s ease,
        filter .45s ease;
    cursor: pointer;
}

.line:hover {
    transform: scale(1.025) translateX(4px);
    background: rgba(255,255,255,.035);
    color: rgba(255,255,255,.72);
    opacity: .85;
}

.line.past {
    opacity: .25;
    color: rgba(255,255,255,.15);
    transform: scale(.94);
    filter: blur(.05px);
}

.line.future {
    opacity: .55;
    color: rgba(255,255,255,.4);
}

.line.active {
    opacity: 1;
    color: #fff;
    transform: scale(1.05);
    background: rgba(255,255,255,.045);
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.035),
        0 12px 35px rgba(0,0,0,.15);
}

.line.active::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 50%;
    width: 2px;
    height: 25px;
    border-radius: 99px;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(255,79,135,.5);
    transform: translateY(-50%);
}

.line.active:hover {
    transform: scale(1.065) translateX(4px);
    background: rgba(255,255,255,.065);
}

.word {
    display: inline-block;
    margin-right: .28em;
    color: rgba(255,255,255,.32);
    transition:
        color .14s ease,
        text-shadow .14s ease,
        transform .14s cubic-bezier(.2,.8,.2,1),
        opacity .14s ease;
}

.word.sung {
    color: rgba(255,255,255,.92);
}

.word.active {
    color: var(--accent-light);
    transform: translateY(-1px) scale(1.035);
    text-shadow:
        0 0 8px rgba(255,79,135,.35),
        0 0 20px rgba(255,79,135,.15);
}

.empty {
    height: 100%;
    min-height: 400px;
    display: grid;
    place-items: center;
    text-align: center;
    color: rgba(255,255,255,.25);
}

.empty strong {
    display: block;
    color: rgba(255,255,255,.55);
    font-size: 15px;
    margin-bottom: 7px;
}

.empty span {
    font-size: 12px;
}

@media (max-width: 850px) {
    .app {
        padding: 12px;
    }

    .player {
        min-height: calc(100vh - 24px);
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .player-card {
        padding: 25px 20px 20px;
        border-radius: 24px;
    }

    .cover-wrapper {
        width: min(65vw, 270px);
        margin-bottom: 22px;
    }

    .song-info {
        margin-bottom: 18px;
    }

    .controls {
        margin-top: 22px;
    }

    .volume-row {
        margin-top: 18px;
    }

    .lyrics-card {
        min-height: 60vh;
        height: 60vh;
        border-radius: 24px;
    }

    .lyrics-section {
        min-height: 0;
        padding: 120px 14px 130px;
    }

    .lyrics-header {
        padding: 20px 20px 15px;
    }

    .line {
        padding: 9px 13px;
        font-size: 17px;
    }

    .line.active {
        transform: scale(1.025);
    }

    .line.active:hover {
        transform: scale(1.04);
    }
}

@media (max-width: 450px) {
    .cover-wrapper {
        width: 57vw;
        max-width: 230px;
    }

    .player-card {
        padding-top: 20px;
    }

    .song-title {
        font-size: 21px;
    }

    .control {
        width: 40px;
        height: 40px;
    }

    .play-button {
        width: 57px;
        height: 57px;
    }

    .lyrics-card {
        height: 58vh;
    }
}
</style>
</head>

<body>

<div class="app">
    <div class="background"></div>

    <main class="player">

        <section class="player-card">

            <div class="cover-wrapper">
                <img
                    id="cover"
                    class="cover"
                    src="cover.jpg"
                    alt="Album cover"
                >
                <div class="cover-glow"></div>
            </div>

            <div class="song-info">
                <h1 id="songTitle" class="song-title">Loading...</h1>
                <p id="songArtist" class="song-artist">Unknown Artist</p>
                <p id="songAlbum" class="song-album">Unknown Album</p>
            </div>

            <div class="progress-area">
                <input
                    id="progress"
                    class="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.01"
                    aria-label="Progress"
                >

                <div class="time-row">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">

                <button
                    id="backButton"
                    class="control"
                    title="Mundur 5 detik"
                    aria-label="Mundur 5 detik"
                >
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M11 6v12l-8.5-6L11 6Zm1.5 0v12l8.5-6-8.5-6Z"/>
                    </svg>
                </button>

                <button
                    id="playButton"
                    class="control play-button"
                    title="Play"
                    aria-label="Play"
                >
                    <svg id="playIcon" class="icon" viewBox="0 0 24 24">
                        <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10-6.8c.6-.4.6-1.3 0-1.7l-10-6.8C8.9 4 8 4.4 8 5.2Z"/>
                    </svg>
                </button>

                <button
                    id="forwardButton"
                    class="control"
                    title="Maju 5 detik"
                    aria-label="Maju 5 detik"
                >
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M13 6v12l8.5-6L13 6Zm-1.5 0v12L3 12l8.5-6Z"/>
                    </svg>
                </button>

            </div>

            <div class="volume-row">

                <button
                    id="muteButton"
                    class="control"
                    style="width:34px;height:34px;"
                    title="Mute"
                    aria-label="Mute"
                >
                    <svg id="volumeIcon" class="icon" viewBox="0 0 24 24">
                        <path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8Zm0-8.3v2.1c2.8 1 4.8 3.5 4.8 6.2s-2 5.2-4.8 6.2v2.1c4-1.1 6.8-4.4 6.8-8.3s-2.8-7.2-6.8-8.3Z"/>
                    </svg>
                </button>

                <input
                    id="volume"
                    class="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value=".8"
                    aria-label="Volume"
                >

            </div>

            <div id="status" class="status">
                Ready
            </div>

            <audio id="audio" preload="metadata">
                <source src="music.mp3" type="audio/mpeg">
            </audio>

        </section>

        <section class="lyrics-card">

            <div class="lyrics-header">
                <div class="lyrics-label">Lyrics</div>
            </div>

            <div
                id="lyricsSection"
                class="lyrics-section"
                aria-label="Lyrics"
            >
                <div class="empty">
                    <div>
                        <strong>Loading lyrics...</strong>
                        <span>Membaca lyric.lrc</span>
                    </div>
                </div>
            </div>

        </section>

    </main>
</div>

<script>
"use strict";

/* =========================================================
   DOM
========================================================= */

const audio = document.getElementById("audio");
const cover = document.getElementById("cover");

const playButton = document.getElementById("playButton");
const playIcon = document.getElementById("playIcon");

const backButton = document.getElementById("backButton");
const forwardButton = document.getElementById("forwardButton");

const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

const muteButton = document.getElementById("muteButton");
const volumeIcon = document.getElementById("volumeIcon");

const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");
const songAlbum = document.getElementById("songAlbum");

const lyricsSection = document.getElementById("lyricsSection");
const statusEl = document.getElementById("status");


/* =========================================================
   STATE
========================================================= */

let lyrics = [];
let metadata = {};

let activeLineIndex = -1;
let previousActiveLineIndex = -1;

let lastRenderedSecond = -1;
let previousVolume = 0.8;


/* =========================================================
   UTILITIES
========================================================= */

function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
    }

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return `${minutes}:${String(secs).padStart(2, "0")}`;
}


/*
 * Memperbaiki mojibake umum akibat encoding UTF-8
 * yang salah terbaca sebagai Windows-1252 / Latin-1.
 */
function normalizeText(text) {
    if (!text) return "";

    let result = text;

    const replacements = {
        "â€“": "–",
        "â€”": "—",
        "â€˜": "‘",
        "â€™": "’",
        "â€œ": "“",
        "â€": "”",
        "â€¦": "…",
        "Â ": " ",
        "Â": "",
        "â€¢": "•",
        "â„¢": "™",
        "âˆ’": "−",
        "ï¿½": "�"
    };

    for (const [bad, good] of Object.entries(replacements)) {
        result = result.split(bad).join(good);
    }

    return result.normalize("NFC");
}


/* =========================================================
   LRC PARSER
========================================================= */

function timeToSeconds(minute, second, fraction = "0") {
    const sec = Number(second);

    /*
     * LRC biasanya memakai centisecond:
     * 00:15.05 = 15.05
     *
     * Jika fraction memiliki 1 digit:
     * .5 -> .5
     *
     * Jika memiliki 2 digit:
     * .05 -> .05
     *
     * Jika lebih panjang:
     * dikonversi sebagai decimal.
     */
    const decimal = Number(`0.${fraction}`);

    return (Number(minute) * 60) + sec + decimal;
}


function parseLRC(text) {
    const result = {
        metadata: {},
        lines: []
    };

    text = normalizeText(text);

    const rawLines = text
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n");

    /*
     * Timestamp line-level:
     * [00:15.05]I know...
     *
     * Word timestamp:
     * [00:15.05]I <00:15.52>know <00:16.02>that
     */
    const lineTimestampRegex =
        /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

    const wordTimestampRegex =
        /<(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?>/g;

    for (const rawLine of rawLines) {

        const line = rawLine.trim();

        if (!line) continue;

        /*
         * Metadata
         */
        const metadataMatch = line.match(
            /^\[([a-zA-Z]+):\s*(.*?)\]$/
        );

        if (metadataMatch) {
            const key = metadataMatch[1].toLowerCase();
            const value = normalizeText(metadataMatch[2]);

            result.metadata[key] = value;
            continue;
        }

        /*
         * Ambil timestamp line-level.
         */
        const timestamps = [];
        let match;

        lineTimestampRegex.lastIndex = 0;

        while ((match = lineTimestampRegex.exec(line)) !== null) {
            const seconds = timeToSeconds(
                match[1],
                match[2],
                match[3] || "0"
            );

            timestamps.push(seconds);
        }

        if (!timestamps.length) continue;

        /*
         * Hapus timestamp pertama dari awal.
         * Timestamp tambahan dianggap repeat timestamp.
         */
        const firstTimestampEnd = line.indexOf("]");

        if (firstTimestampEnd === -1) continue;

        const content = line
            .slice(firstTimestampEnd + 1)
            .trim();

        /*
         * Parse word-level timestamp.
         */
        const words = [];

        let lastIndex = 0;
        let wordMatch;

        wordTimestampRegex.lastIndex = 0;

        /*
         * Teks sebelum timestamp kata pertama
         * memakai timestamp line sebagai timestamp awal.
         */
        while ((wordMatch = wordTimestampRegex.exec(content)) !== null) {

            const textBefore = content
                .slice(lastIndex, wordMatch.index)
                .trim();

            if (textBefore) {
                words.push({
                    text: textBefore,
                    time: null
                });
            }

            const wordTime = timeToSeconds(
                wordMatch[1],
                wordMatch[2],
                wordMatch[3] || "0"
            );

            words.push({
                text: "",
                time: wordTime
            });

            lastIndex = wordTimestampRegex.lastIndex;
        }

        /*
         * Cara di atas menghasilkan timestamp sebagai token kosong.
         * Sekarang gabungkan timestamp dengan kata berikutnya.
         */
        const reconstructedWords = [];

        if (wordTimestampRegex.test(content)) {

            const parts = [];
            let cursor = 0;

            wordTimestampRegex.lastIndex = 0;

            while ((wordMatch = wordTimestampRegex.exec(content)) !== null) {

                const textPart = content.slice(
                    cursor,
                    wordMatch.index
                ).trim();

                const timestamp = timeToSeconds(
                    wordMatch[1],
                    wordMatch[2],
                    wordMatch[3] || "0"
                );

                if (textPart) {
                    parts.push({
                        text: textPart,
                        time: timestamp
                    });
                }

                cursor = wordTimestampRegex.lastIndex;
            }

            const finalText = content.slice(cursor).trim();

            if (finalText) {
                /*
                 * Jika ada timestamp terakhir, kata setelahnya
                 * menggunakan timestamp tersebut.
                 */
                const lastTimestamp = parts.length
                    ? parts[parts.length - 1].time
                    : timestamps[0];

                parts.push({
                    text: finalText,
                    time: lastTimestamp
                });
            }

            reconstructedWords.push(...parts);
        }

        const finalWords = reconstructedWords.length
            ? reconstructedWords
            : [{
                text: content,
                time: timestamps[0]
            }];

        /*
         * Jika ada beberapa timestamp line-level,
         * buat line terpisah.
         */
        for (const start of timestamps) {

            result.lines.push({
                time: start,
                text: content,
                words: finalWords.map(word => ({
                    text: word.text,
                    time: word.time
                }))
            });
        }
    }

    /*
     * Sort timestamp.
     */
    result.lines.sort((a, b) => a.time - b.time);

    /*
     * Jika word timestamp tidak tersedia,
     * gunakan timestamp line sebagai fallback.
     */
    for (const line of result.lines) {
        line.words = line.words.filter(
            word => word.text
        );

        if (!line.words.length && line.text) {
            line.words = [{
                text: line.text,
                time: line.time
            }];
        }
    }

    return result;
}


/* =========================================================
   LOAD LYRICS
========================================================= */

async function loadLyrics() {

    try {

        statusEl.textContent = "Loading lyrics...";

        const response = await fetch(
            "lyric.lrc",
            {
                cache: "no-cache"
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const text = await response.text();

        if (!text.trim()) {
            throw new Error("LRC kosong");
        }

        const parsed = parseLRC(text);

        metadata = parsed.metadata;
        lyrics = parsed.lines;

        renderLyrics();
        applyMetadata();

        statusEl.textContent =
            `${lyrics.length} lyric lines`;

    } catch (error) {

        console.error("Lyrics error:", error);

        lyrics = [];

        lyricsSection.innerHTML = `
            <div class="empty">
                <div>
                    <strong>Lyrics tidak ditemukan</strong>
                    <span>Pastikan file lyric.lrc berada di folder yang sama.</span>
                </div>
            </div>
        `;

        statusEl.textContent =
            "Lyrics tidak ditemukan";
    }
}


/* =========================================================
   METADATA
========================================================= */

function applyMetadata() {

    songTitle.textContent =
        metadata.ti || "Unknown Title";

    songArtist.textContent =
        metadata.ar || "Unknown Artist";

    songAlbum.textContent =
        metadata.al || "Unknown Album";

    if (metadata.length) {
        durationEl.textContent =
            normalizeText(metadata.length);
    }
}


/* =========================================================
   RENDER LYRICS
========================================================= */

function renderLyrics() {

    if (!lyrics.length) {
        lyricsSection.innerHTML = `
            <div class="empty">
                <div>
                    <strong>Lyrics tidak ditemukan</strong>
                    <span>File LRC tidak memiliki timestamp yang valid.</span>
                </div>
            </div>
        `;
        return;
    }

    const fragment = document.createDocumentFragment();

    lyrics.forEach((line, lineIndex) => {

        const lineElement =
            document.createElement("div");

        lineElement.className =
            "line future";

        lineElement.dataset.index =
            lineIndex;

        lineElement.dataset.time =
            line.time;

        /*
         * Render setiap kata sebagai span.
         */
        line.words.forEach((word, wordIndex) => {

            const wordElement =
                document.createElement("span");

            wordElement.className = "word";

            wordElement.textContent =
                word.text;

            wordElement.dataset.time =
                word.time;

            wordElement.dataset.wordIndex =
                wordIndex;

            lineElement.appendChild(wordElement);

        });

        fragment.appendChild(lineElement);
    });

    lyricsSection.innerHTML = "";
    lyricsSection.appendChild(fragment);
}


/* =========================================================
   FIND ACTIVE LINE
========================================================= */

function findActiveLine(time) {

    let index = -1;

    /*
     * Binary search supaya efisien
     * walaupun LRC memiliki banyak baris.
     */
    let low = 0;
    let high = lyrics.length - 1;

    while (low <= high) {

        const mid = (low + high) >> 1;

        if (lyrics[mid].time <= time) {
            index = mid;
            low = mid + 1;
        } else {
            high = mid - 1;
        }
    }

    return index;
}


/* =========================================================
   UPDATE LINE STATES
========================================================= */

function updateLineStates(time) {

    if (!lyrics.length) return;

    activeLineIndex = findActiveLine(time);

    /*
     * Jangan melakukan pekerjaan DOM berat
     * jika baris aktif belum berubah.
     */
    if (
        activeLineIndex === previousActiveLineIndex
    ) {
        return;
    }

    const lineElements =
        lyricsSection.querySelectorAll(".line");

    lineElements.forEach((element, index) => {

        element.classList.remove(
            "past",
            "active",
            "future"
        );

        if (index < activeLineIndex) {
            element.classList.add("past");

        } else if (index === activeLineIndex) {
            element.classList.add("active");

        } else {
            element.classList.add("future");
        }
    });

    /*
     * Auto-scroll hanya saat active line berubah.
     */
    if (
        activeLineIndex !== -1 &&
        activeLineIndex !== previousActiveLineIndex
    ) {

        const target =
            lineElements[activeLineIndex];

        if (target) {

            const containerHeight =
                lyricsSection.clientHeight;

            const targetTop =
                target.offsetTop -
                (containerHeight / 2) +
                (target.offsetHeight / 2);

            lyricsSection.scrollTo({
                top: Math.max(0, targetTop),
                behavior: "smooth"
            });
        }
    }

    previousActiveLineIndex =
        activeLineIndex;
}


/* =========================================================
   WORD-LEVEL KARAOKE
========================================================= */

function updateLyrics(time) {

    if (!lyrics.length) return;

    /*
     * Update line state terlebih dahulu.
     */
    updateLineStates(time);

    if (
        activeLineIndex < 0 ||
        !lyrics[activeLineIndex]
    ) {
        return;
    }

    const line =
        lyrics[activeLineIndex];

    const lineElement =
        lyricsSection.querySelector(
            `.line[data-index="${activeLineIndex}"]`
        );

    if (!lineElement) return;

    const wordElements =
        lineElement.querySelectorAll(".word");

    /*
     * Set status masing-masing kata.
     */
    wordElements.forEach((wordElement, index) => {

        const wordTime =
            Number(wordElement.dataset.time);

        const nextWord =
            wordElements[index + 1];

        const nextTime = nextWord
            ? Number(nextWord.dataset.time)
            : Infinity;

        wordElement.classList.remove(
            "active",
            "sung"
        );

        /*
         * Belum dinyanyikan
         */
        if (time < wordTime) {
            return;
        }

        /*
         * Sedang dinyanyikan
         */
        if (
            time >= wordTime &&
            time < nextTime
        ) {
            wordElement.classList.add("active");
            return;
        }

        /*
         * Sudah dinyanyikan
         */
        wordElement.classList.add("sung");
    });
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer() {

    const current =
        audio.currentTime || 0;

    const total =
        audio.duration || 0;

    currentTimeEl.textContent =
        formatTime(current);

    if (Number.isFinite(total)) {
        durationEl.textContent =
            formatTime(total);
    }

    const percent =
        total > 0
            ? (current / total) * 100
            : 0;

    progress.value = percent;

    progress.style.setProperty(
        "--progress",
        `${percent}%`
    );

    /*
     * Hindari update lyrics berlebihan.
     */
    const second =
        Math.floor(current * 20);

    if (second !== lastRenderedSecond) {

        lastRenderedSecond = second;

        updateLyrics(current);
    }
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

async function togglePlay() {

    try {

        if (audio.paused) {
            await audio.play();
        } else {
            audio.pause();
        }

    } catch (error) {

        console.error("Playback error:", error);

        statusEl.textContent =
            "Audio gagal diputar";
    }
}


function updatePlayUI() {

    if (audio.paused) {

        /*
         * Play icon
         */
        playIcon.innerHTML = `
            <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10-6.8c.6-.4.6-1.3 0-1.7l-10-6.8C8.9 4 8 4.4 8 5.2Z"/>
        `;

        playButton.setAttribute(
            "aria-label",
            "Play"
        );

        playButton.title = "Play";

        cover.classList.remove("playing");

        statusEl.textContent = "Paused";

    } else {

        /*
         * Pause icon
         */
        playIcon.innerHTML = `
            <path d="M7 5h3v14H7V5Zm7 0h3v14h-3V5Z"/>
        `;

        playButton.setAttribute(
            "aria-label",
            "Pause"
        );

        playButton.title = "Pause";

        cover.classList.add("playing");

        statusEl.textContent = "Playing";
    }
}


/* =========================================================
   PROGRESS SEEK
========================================================= */

progress.addEventListener("input", () => {

    if (!Number.isFinite(audio.duration)) {
        return;
    }

    const percent =
        Number(progress.value);

    audio.currentTime =
        audio.duration * (percent / 100);

    progress.style.setProperty(
        "--progress",
        `${percent}%`
    );
});


/* =========================================================
   VOLUME
========================================================= */

function updateVolumeUI() {

    const value =
        Number(volume.value);

    const percentage =
        value * 100;

    volume.style.setProperty(
        "--volume",
        `${percentage}%`
    );

    if (audio.muted || value === 0) {

        volumeIcon.innerHTML = `
            <path d="M4 9v6h4l5 4V5L8 9H4Zm13.2 1.8-1.4 1.4 1.4 1.4 1.4-1.4-1.4-1.4Zm2.5-2.5-1.4 1.4L19.7 11l1.4-1.4-1.4-1.3Zm0 7.8-1.4-1.4-1.3 1.4 1.4 1.4 1.3-1.4Z"/>
        `;

    } else {

        volumeIcon.innerHTML = `
            <path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8Zm0-8.3v2.1c2.8 1 4.8 3.5 4.8 6.2s-2 5.2-4.8 6.2v2.1c4-1.1 6.8-4.4 6.8-8.3s-2.8-7.2-6.8-8.3Z"/>
        `;
    }
}


volume.addEventListener("input", () => {

    const value =
        Number(volume.value);

    audio.volume = value;

    audio.muted = false;

    previousVolume =
        value > 0
            ? value
            : previousVolume;

    updateVolumeUI();
});


muteButton.addEventListener("click", () => {

    if (audio.muted || audio.volume === 0) {

        audio.muted = false;

        if (audio.volume === 0) {
            audio.volume =
                previousVolume || .8;

            volume.value =
                audio.volume;
        }

    } else {

        previousVolume =
            audio.volume;

        audio.muted = true;
    }

    updateVolumeUI();
});


/* =========================================================
   SEEK BUTTONS
========================================================= */

backButton.addEventListener("click", () => {

    audio.currentTime =
        Math.max(
            0,
            audio.currentTime - 5
        );

    updatePlayer();
});


forwardButton.addEventListener("click", () => {

    audio.currentTime =
        Math.min(
            audio.duration || Infinity,
            audio.currentTime + 5
        );

    updatePlayer();
});


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener("keydown", event => {

    const target =
        event.target;

    const isInput =
        target.tagName === "INPUT" ||
        target.tagName === "TEXTAREA" ||
        target.isContentEditable;

    if (isInput) return;

    if (event.code === "Space") {

        event.preventDefault();

        togglePlay();

    } else if (event.code === "ArrowLeft") {

        event.preventDefault();

        audio.currentTime =
            Math.max(
                0,
                audio.currentTime - 5
            );

        updatePlayer();

    } else if (event.code === "ArrowRight") {

        event.preventDefault();

        audio.currentTime =
            Math.min(
                audio.duration || Infinity,
                audio.currentTime + 5
            );

        updatePlayer();
    }
});


/* =========================================================
   AUDIO EVENTS
========================================================= */

audio.addEventListener("loadedmetadata", () => {

    durationEl.textContent =
        formatTime(audio.duration);

    /*
     * Jika LRC mempunyai length,
     * duration audio tetap menjadi sumber utama.
     */
    if (Number.isFinite(audio.duration)) {
        statusEl.textContent =
            "Ready";
    }
});


audio.addEventListener("timeupdate", updatePlayer);

audio.addEventListener("play", () => {
    updatePlayUI();
});


audio.addEventListener("pause", () => {
    updatePlayUI();
});


audio.addEventListener("ended", () => {

    updatePlayUI();

    progress.value = 100;

    progress.style.setProperty(
        "--progress",
        "100%"
    );

    /*
     * Tandai semua lirik sebagai selesai.
     */
    lyricsSection
        .querySelectorAll(".line")
        .forEach(line => {
            line.classList.remove(
                "active",
                "future"
            );
            line.classList.add("past");
        });
});


audio.addEventListener("error", error => {

    console.error(
        "Audio failed:",
        error
    );

    statusEl.textContent =
        "Audio gagal dimuat";

    songTitle.textContent =
        metadata.ti || "Audio Error";
});


audio.addEventListener("waiting", () => {

    statusEl.textContent =
        "Buffering...";
});


audio.addEventListener("canplay", () => {

    if (!audio.paused) {
        statusEl.textContent =
            "Playing";
    } else {
        statusEl.textContent =
            "Ready";
    }
});


/* =========================================================
   BUTTON
========================================================= */

playButton.addEventListener(
    "click",
    togglePlay
);


/* =========================================================
   COVER ERROR
========================================================= */

cover.addEventListener("error", () => {

    /*
     * Jangan membuat aplikasi crash
     * jika cover.jpg tidak tersedia.
     */
    cover.style.opacity = "0";

    statusEl.textContent =
        "Cover tidak ditemukan";
});


/* =========================================================
   INITIALIZATION
========================================================= */

audio.volume = .8;
volume.value = .8;

updateVolumeUI();
updatePlayUI();

loadLyrics();
</script>

</body>
</html>
