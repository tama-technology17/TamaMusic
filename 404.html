<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Page Not Found</title>
  <meta name="theme-color" content="#08080a">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08080a;
      --text: #fff;
      --muted: #777780;
      --border: rgba(255,255,255,.1);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      font-family: "Inter", sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(120, 90, 255, .14),
          transparent 35%
        ),
        radial-gradient(
          circle at 20% 80%,
          rgba(0, 180, 255, .05),
          transparent 30%
        ),
        var(--bg);

      overflow: hidden;
    }

    /* Background grid */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.025) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 30%,
        black 70%,
        transparent
      );
    }

    .wrapper {
      width: min(650px, 100%);
      text-align: center;

      animation: appear .7s ease both;
    }

    /* 404 */

    .error-code {
      position: relative;

      font-size: clamp(110px, 30vw, 220px);
      font-weight: 800;

      line-height: .8;
      letter-spacing: -12px;

      color: transparent;

      background:
        linear-gradient(
          180deg,
          #fff 0%,
          #777 45%,
          #222 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      filter:
        drop-shadow(
          0 20px 50px rgba(255,255,255,.08)
        );

      user-select: none;
    }

    .error-code::after {
      content: "404";

      position: absolute;
      inset: 0;

      color: transparent;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.5),
          transparent
        );

      -webkit-background-clip: text;
      background-clip: text;

      animation: shine 4s infinite;
    }

    /* Content */

    .icon {
      width: 60px;
      height: 60px;

      display: grid;
      place-items: center;

      margin: 45px auto 20px;

      border-radius: 18px;

      border: 1px solid var(--border);

      background:
        rgba(255,255,255,.045);

      font-size: 25px;

      box-shadow:
        0 15px 40px rgba(0,0,0,.3);
    }

    h1 {
      font-size: clamp(24px, 6vw, 34px);
      letter-spacing: -1px;

      margin-bottom: 12px;
    }

    .description {
      max-width: 430px;
      margin: auto;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.7;
    }

    /* URL */

    .url {
      display: inline-block;

      margin-top: 20px;
      padding: 9px 14px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: rgba(255,255,255,.035);

      color: #66666e;

      font-family: monospace;
      font-size: 12px;

      max-width: 100%;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Buttons */

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;

      margin-top: 30px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      min-width: 150px;
      height: 48px;

      padding: 0 20px;

      border-radius: 14px;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;

      transition: .25s ease;

      cursor: pointer;
    }

    .btn-primary {
      color: #08080a;

      background: white;

      box-shadow:
        0 10px 30px rgba(255,255,255,.08);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow:
        0 15px 40px rgba(255,255,255,.14);
    }

    .btn-secondary {
      color: #aaa;

      background: rgba(255,255,255,.045);

      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      color: white;

      border-color:
        rgba(255,255,255,.2);

      background:
        rgba(255,255,255,.07);

      transform: translateY(-3px);
    }

    .btn:active {
      transform: scale(.97);
    }

    /* Footer */

    footer {
      margin-top: 50px;

      color: #44444b;

      font-size: 11px;
    }

    /* Animations */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%);
      }

      40%,
      100% {
        transform: translateX(100%);
      }
    }

    /* Mobile */

    @media (max-width: 500px) {

      .error-code {
        letter-spacing: -7px;
      }

      .icon {
        margin-top: 35px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <main class="wrapper">

    <div class="error-code">
      404
    </div>

    <div class="icon">
      ⌁
    </div>

    <h1>
      Halaman Tidak Ditemukan
    </h1>

    <p class="description">
      Halaman yang kamu cari tidak tersedia,
      mungkin sudah dipindahkan, dihapus,
      atau URL yang dimasukkan tidak benar.
    </p>

    <div
      id="currentUrl"
      class="url"
    >
      /
    </div>

    <div class="actions">

      <a
        href="/"
        class="btn btn-primary"
      >
        ← Kembali ke Home
      </a>

      <button
        onclick="history.back()"
        class="btn btn-secondary"
      >
        ↶ Halaman Sebelumnya
      </button>

    </div>

    <footer>
      Tama Technology · 404
    </footer>

  </main>


  <script>

    const currentUrl =
      document.getElementById("currentUrl");

    currentUrl.textContent =
      window.location.pathname;

  </script>

</body>
</html>
